name: CI Gate & Monorepo Guard

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect Changed Paths
    runs-on: ubuntu-latest
    outputs:
      docs: ${{ steps.filter.outputs.docs }}
      core: ${{ steps.filter.outputs.core }}
      apps_arena: ${{ steps.filter.outputs.apps_arena }}
      apps_proxy: ${{ steps.filter.outputs.apps_proxy }}
      apps_orchestrator: ${{ steps.filter.outputs.apps_orchestrator }}
      infra: ${{ steps.filter.outputs.infra }}
      build_system: ${{ steps.filter.outputs.build_system }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Paths Filter
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            docs:
              - 'docs/**'
              - '*.md'
              - '.gitignore'
              - 'LICENSE'
            core:
              - 'core/**'
            apps_arena:
              - 'apps/arena-server/**'
            apps_proxy:
              - 'apps/proxy/**'
            apps_orchestrator:
              - 'apps/orchestrator/**'
            infra:
              - 'infra/**'
              - '.github/**'
              - 'Dockerfile*'
            build_system:
              - 'build.gradle.kts'
              - 'settings.gradle.kts'
              - 'gradle.properties'
              - 'gradle/**'
              - 'gradlew*'

  lint-docs:
    name: Lint Documentation
    needs: changes
    if: needs.changes.outputs.docs == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Verify Markdown Links & Format
        run: |
          echo "[lint-docs] Verifying documentation markdown files..."
          python3 -c "
          import os, glob
          md_files = glob.glob('**/*.md', recursive=True)
          for path in md_files:
              with open(path, 'r', encoding='utf-8') as f:
                  f.read()
          print(f'[lint-docs] {len(md_files)} markdown files syntax checked.')
          "

  check-core:
    name: Check Core Domain & Purity
    needs: changes
    if: needs.changes.outputs.core == 'true' || needs.changes.outputs.build_system == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Grant Execute Permission for Gradlew
        run: chmod +x gradlew

      - name: Run Domain Purity Guard & Pure Unit Tests
        run: ./gradlew checkDomainPurity :core:physics:test :core:stats:test --no-daemon

  build-arena:
    name: Build Arena Server (Chained with Core)
    needs: changes
    if: needs.changes.outputs.apps_arena == 'true' || needs.changes.outputs.core == 'true' || needs.changes.outputs.build_system == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Grant Execute Permission for Gradlew
        run: chmod +x gradlew

      - name: Build Arena Server
        run: ./gradlew :apps:arena-server:build --no-daemon

  build-proxy:
    name: Build Velocity Proxy
    needs: changes
    if: needs.changes.outputs.apps_proxy == 'true' || needs.changes.outputs.build_system == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Grant Execute Permission for Gradlew
        run: chmod +x gradlew

      - name: Build Velocity Proxy
        run: ./gradlew :apps:proxy:build --no-daemon

  build-orchestrator:
    name: Build Orchestrator Daemon
    needs: changes
    if: needs.changes.outputs.apps_orchestrator == 'true' || needs.changes.outputs.build_system == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Grant Execute Permission for Gradlew
        run: chmod +x gradlew

      - name: Build Orchestrator
        run: ./gradlew :apps:orchestrator:build --no-daemon

  security-scan:
    name: Security Vulnerability Scan (Trivy)
    needs: changes
    if: needs.changes.outputs.infra == 'true' || needs.changes.outputs.build_system == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Run Trivy FS Vulnerability Scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          severity: 'CRITICAL,HIGH'
          exit-code: '1'
          ignore-unfixed: true

  ci-gate:
    name: CI Gate (Required Status Check)
    needs: [changes, lint-docs, check-core, build-arena, build-proxy, build-orchestrator, security-scan]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Evaluate All Upstream CI Jobs
        env:
          NEEDS_CONTEXT: ${{ toJSON(needs) }}
        run: |
          python3 -c "
          import os, json, sys

          raw = os.environ.get('NEEDS_CONTEXT', '{}')
          data = json.loads(raw)

          failed = []
          for name, job in data.items():
              result = job.get('result')
              print(f'Job [{name}]: {result}')
              if result in ('failure', 'cancelled'):
                  failed.append(f'{name} ({result})')

          if failed:
              print(f'ERROR: CI Gate blocked! Failed jobs: {failed}', file=sys.stderr)
              sys.exit(1)

          print('SUCCESS: All triggered jobs passed. CI Gate unlocked.')
          "
